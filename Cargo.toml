[package]
name = "termgraph"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
description = "Draw basic bar graphs in the terminal"
license = "MIT"
publish = false

[lib]
name = "termgraph"
path = "src/lib.rs"

[[bin]]
name = "termgraph"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
thiserror = "2"

[dev-dependencies]
insta = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
